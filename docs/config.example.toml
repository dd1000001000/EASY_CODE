# Copy desired settings to .easycode/config.toml or the user config.toml.
# Generate the current defaults with: easy-code config defaults
# Keys inside [limits] use camelCase. Unknown/legacy limit keys are errors.
# Provider/model metadata lives in the fixed user file ~/.easy_code/models.toml.
# It includes endpoints, credential environment names, wire protocols, exact
# model IDs, labels and capabilities. EASY CODE validates it on every startup
# and never overwrites an existing copy. API keys do not belong in that file.
# This operational config may retain legacy user-level endpoint overrides;
# workspace config may not redirect provider endpoints.
orchestrationEnabled = false
# Optional approvalModel belongs in USER config only; defaults to the active model.
# approvalModel = "glm-5.3-flash"

[limits]
maxContextChars = 250000
maxActiveContextChars = 250000
# Default 1M model window. Known catalog windows cap this value conservatively.
# 0 selects legacy character mode; character limits do not cap reads in Token mode.
# Percentages use input capacity AFTER output/tool/safety reserves, not the raw window.
maxContextTokens = 1000000
# Captured raw tool evidence and model-facing results are separate budgets.
maxOutputChars = 256000
maxToolResultChars = 64000
commandTimeoutMs = 120000
sandboxStartupWindowsMs = 75000
sandboxStartupPosixMs = 30000
sandboxCleanupTimeoutMs = 45000
# A compatibility assumption, NOT a network permission. Use requiredCapabilities=[]
# for a check known not to need IPC; the OS boundary remains unchanged.
sandboxVerificationRequiresLoopback = true
# Offer the exact host-scoped invocation to the existing approval flow.
# No workspace grant authorizes host scope. Never applies to Benchmark.
sandboxAllowHostEscalation = true
# Rootless Podman on Linux; rootless Podman machine on Windows/macOS.
# npm postinstall and sandbox setup prepare the engine/machine and missing image.
# Existing machines are reused, not resized; changes below apply on creation.
podmanImage = "localhost/easy-code-sandbox:0.1.0"
podmanMachineName = "easy-code"
podmanMachineMemoryMb = 8192
podmanMachineCpus = 4
podmanMachineDiskGb = 60
podmanMemoryMb = 4096
podmanCpus = 2
podmanPidsLimit = 512
podmanShmMb = 256
podmanTmpMb = 1024
podmanControlTimeoutMs = 30000
podmanSetupTimeoutMs = 1200000
podmanProxyMaxConnections = 32
podmanProxyMaxBytes = 536870912
# These are per-container limits, not a global resource quota. Rootfs disk usage
# is bounded by the Podman machine/storage, not by the RAM or tmpfs settings.
commandInspectTimeoutMaxMs = 60000
commandExecuteTimeoutMaxMs = 900000
commandInstallTimeoutMaxMs = 1200000
maxManagedWorktrees = 15
maxSubagentsPerTurn = 8
maxSubagentFollowUps = 8
maxDagNodes = 16
# Shared by main agent, children, reviewer, routing and compaction; includes retries.
maxModelRequests = 120
# 0 = disabled. Nonzero uses conservative reservations, settled by reported usage.
maxTaskTokens = 0
# Local output reservation only. No output-token ceiling is sent to the server.
maxResponseTokens = 32768
# Independent transport safety ceiling, not a summary/display limit (16 MiB).
providerResponseMaxBytes = 16777216
# Live UI only: batch deltas and bound in-progress previews; final output is retained.
streamFlushIntervalMs = 50
streamPreviewMaxChars = 16000
# Retry counts exclude the initial attempt. Shared by every agent role.
maxProviderRetries = 5
modelContentRetries = 2
sandboxInitializationRetries = 1
# Non-replay invariants: these settings only accept 0.
commandExecutionRetries = 0
subagentFailureRetries = 0
prematureFinishRetries = 0
providerRetryWaitMs = 30000
defaultReadLines = 100
maxReadLines = 1000
maxReadResultTokens = 24000
memoryAutoTokens = 2000
memoryRecallTokens = 12000
memoryMaxItems = 6
memoryMaxQueries = 3
memorySearchLimit = 6
memoryMinRelevantTerms = 1
maxDurableMemoryTokens = 400
searchMaxEntries = 10000
searchMaxDepth = 64
searchRepeatWarningCount = 3
searchMaxFileBytes = 1048576
searchMaxBytes = 16777216
searchMaxMatches = 60
searchContextLines = 2
searchMaxResultTokens = 6000
commandQueryChars = 24000
commandMaxDiagnostics = 16
commandSuccessChars = 2000
commandFailureChars = 16000
commandPollWaitMs = 120000
compactionRetainRecentExchanges = 5
contextReferenceTriggerRatio = 0.8
contextReferenceTargetRatio = 0.6
contextRecallProtectionExchanges = 2
reviewMaxRounds = 5
reviewMaxRequests = 32
reviewMaxToolCalls = 20
reviewTimeoutMs = 600000
reviewSummaryTimeoutMs = 120000
reviewSnapshotMaxBytes = 134217728
reviewDependencyMaxBytes = 1073741824
reviewDependencyMaxFiles = 100000
reviewPreparationTimeoutMs = 120000
reviewSummaryMaxTokens = 4096
reviewMaxSessionsPerTask = 3
contextCompactionTriggerRatio = 0.9
contextCompactionTargetRatio = 0.6
contextCompactionMinGrowthRatio = 0.1
contextMaxRebasesPerRequest = 1
contextMaxCapacityRetries = 1
# Retained summary estimate including JSON wrapper; not a generation limit.
contextSummaryMaxTokens = 8192
contextToolBatchTokens = 65536
contextToolReferenceMinChars = 4096
# Reviewer remains enabled and independently restricted to its read-only profile.
reviewerOutputTokens = 6144 # local report storage budget
# Independent command approval agent: shared retries within one bounded deadline.
approvalInputChars = 24000
approvalOutputTokens = 1024 # local report storage budget
approvalTimeoutMs = 60000
validationBaselineMaxFiles = 8000
validationScanMaxEntries = 50000
validationScanMaxBytes = 67108864
progressInvestigationMinSamples = 5
progressInvestigationRepeatRatio = 0.7
progressInvestigationWindowResponses = 12
# Set false for observation/reminders only; never enables automatic early exit.
progressInvestigationReviewEnabled = true
contextOutputReserveRatio = 0.2
contextToolReserveTokens = 65536
contextToolReserveRatio = 0.1
contextSafetyReserveTokens = 512
contextSafetyReserveRatio = 0.05

# Additional content budgets. Storage/display clipping never authorizes partial execution.
commandArchiveMaxBytes = 33554432
commandThreadArchiveMaxBytes = 268435456
memoryContentMaxChars = 1200
evidenceRecallDefaultChars = 8000
evidenceRecallMaxChars = 32000
artifactIndexBatchChars = 96000
artifactChunkChars = 1400
artifactChunkOverlapChars = 160
subagentInstructionsMaxChars = 12000
subagentFollowUpMaxChars = 8000
subagentSummaryMaxChars = 12000
contextForceRatio = 0.95
contextMemoryResumeRatio = 0.6
reviewBriefingMaxTokens = 6144
reviewHandoffMaxTokens = 12288
reviewClosingInputReserveTokens = 100000
contextCompactionMaxGrowthTokens = 32768
contextCompactionMinNewTokens = 8192
contextCompactionMinSavedTokens = 8192
contextCompactionMinSavingsRatio = 0.1
contextSummaryMaxChars = 64000
contextSemanticFieldMaxChars = 4000

[limits.steps]
none = 40
low = 40
medium = 40
high = 80

# Resolved from the current parent thinking effort, including after a switch.
[limits.maxConcurrentSubagents]
none = 2
low = 2
medium = 4
high = 8

[limits.providerTimeoutMs]
none = 300000
low = 300000
medium = 450000
high = 600000
