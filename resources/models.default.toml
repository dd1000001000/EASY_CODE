schema_version = 1
default_model = "qwen-default"

[providers.qwen]
name = "Alibaba Qwen"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
env_key = "QWEN_API_KEY"
env_key_aliases = ["DASHSCOPE_API_KEY"]
wire_api = "chat_completions"
max_retries = 5
supports_temperature = true
supports_strict_tools = true

[providers.qwen.image_constraints]
min_width = 11
min_height = 11
max_long_edge = 7680
max_short_edge = 4320
max_aspect_ratio = 200
blocked_media_types = ["image/gif"]
large_image_threshold = 4096
large_image_media_types = ["image/png", "image/jpeg"]

[providers.deepseek]
name = "DeepSeek"
base_url = "https://api.deepseek.com"
env_key = "DEEPSEEK_API_KEY"
wire_api = "chat_completions"
max_retries = 5
supports_temperature = true
supports_strict_tools = true

[providers.kimi]
name = "Kimi Coding Plan"
base_url = "https://api.kimi.com/coding/v1"
env_key = "KIMI_API_KEY"
wire_api = "chat_completions"
max_retries = 5
supports_temperature = false
supports_strict_tools = true

[providers.glm]
name = "Zhipu GLM"
base_url = "https://open.bigmodel.cn/api/paas/v4"
env_key = "GLM_API_KEY"
env_key_aliases = ["ZAI_API_KEY", "ZHIPUAI_API_KEY"]
wire_api = "chat_completions"
max_retries = 5
supports_temperature = true
supports_strict_tools = false

[providers.glm-coding-plan]
name = "GLM Coding Plan"
base_url = "https://open.bigmodel.cn/api/coding/paas/v4"
env_key = "GLM_CODING_PLAN_API_KEY"
wire_api = "chat_completions"
max_retries = 5
supports_temperature = true
supports_strict_tools = false

[models.qwen-default]
name = "Qwen3.7-Max"
provider = "qwen"
model = "qwen3.7-max"
context_window = 1000000
input_modalities = ["text"]
tool_calling = true
reasoning = true

